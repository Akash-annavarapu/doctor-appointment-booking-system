name: TestPilot regression checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test -- --reporter=json --outputFile=/tmp/testpilot-frontend.json
      - name: Publish verified frontend run
        if: always()
        env:
          TESTPILOT_REPORT_API_URL: ${{ vars.TESTPILOT_REPORT_API_URL }}
          REPORT_INGEST_TOKEN: ${{ secrets.REPORT_INGEST_TOKEN }}
        run: |
          if [ -f /tmp/testpilot-frontend.json ]; then
            node ../server/scripts/publishTestReport.js /tmp/testpilot-frontend.json frontend-vitest
          fi
      - name: Build
        run: npm run build

  backend:
    name: Backend integration tests (isolated MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      JWT_SECRET: testpilot-ci-only-synthetic-secret-not-for-production
      MONGO_URI: mongodb://127.0.0.1:27017/testpilot_ci_dev
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/testpilot_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        run: npm ci
      - name: Test in isolated test database
        run: npm test -- --json --outputFile=/tmp/testpilot-backend.json
      - name: Publish verified backend run
        if: always()
        env:
          TESTPILOT_REPORT_API_URL: ${{ vars.TESTPILOT_REPORT_API_URL }}
          REPORT_INGEST_TOKEN: ${{ secrets.REPORT_INGEST_TOKEN }}
        run: |
          if [ -f /tmp/testpilot-backend.json ]; then
            node scripts/publishTestReport.js /tmp/testpilot-backend.json backend-jest
          fi
