name: TestPilot regression checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test -- --reporter=json --outputFile=/tmp/testpilot-frontend.json
      - name: Publish verified frontend run
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TESTPILOT_REPORT_API_URL: ${{ vars.TESTPILOT_REPORT_API_URL }}
          REPORT_INGEST_TOKEN: ${{ secrets.REPORT_INGEST_TOKEN }}
        run: |
          if [ -f /tmp/testpilot-frontend.json ]; then
            node ../server/scripts/publishTestReport.js /tmp/testpilot-frontend.json frontend-vitest
          fi
      - name: Build
        run: npm run build

  playwright:
    name: Playwright Chromium + isolated generated-case API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      NODE_ENV: test
      TESTPILOT_ISOLATED_API: "1"
      JWT_SECRET: testpilot-generated-api-local-only-synthetic-jwt
      MONGO_URI: mongodb://127.0.0.1:27017/testpilot_generated_test
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/testpilot_generated_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix client
      - name: Build isolated browser target
        env:
          VITE_API_BASE_URL: http://127.0.0.1:4173/api/v1
        run: npm run build --prefix client
      - name: Install server dependencies for isolated generated-case API tests
        run: npm ci --prefix server
      - name: Install pinned Playwright runner
        run: npm install --prefix e2e --no-audit --no-fund
      - name: Install Chromium
        run: cd e2e && npx playwright install --with-deps chromium
      - name: Test result conversion
        run: npm run test:unit --prefix e2e
      - name: Run Playwright Chromium browser tests
        run: npm test --prefix e2e
      - name: Convert measured Playwright report
        if: always()
        run: |
          if [ -f e2e/artifacts/results.json ]; then
            node e2e/scripts/toJest.cjs e2e/artifacts/results.json /tmp/testpilot-playwright-jest.json
          fi
      - name: Publish verified browser test results
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TESTPILOT_REPORT_API_URL: ${{ vars.TESTPILOT_REPORT_API_URL }}
          REPORT_INGEST_TOKEN: ${{ secrets.REPORT_INGEST_TOKEN }}
        run: |
          if [ -f /tmp/testpilot-playwright-jest.json ]; then
            node server/scripts/publishTestReport.js /tmp/testpilot-playwright-jest.json playwright-chromium
          fi
      - name: Upload HTML report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-report
          path: |
            e2e/artifacts/
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: Backend integration tests (isolated MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      JWT_SECRET: testpilot-ci-only-synthetic-secret-not-for-production
      MONGO_URI: mongodb://127.0.0.1:27017/testpilot_ci_dev
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/testpilot_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        run: npm ci
      - name: Test in isolated test database
        run: npm test -- --json --outputFile=/tmp/testpilot-backend.json
      - name: Publish verified backend run
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TESTPILOT_REPORT_API_URL: ${{ vars.TESTPILOT_REPORT_API_URL }}
          REPORT_INGEST_TOKEN: ${{ secrets.REPORT_INGEST_TOKEN }}
        run: |
          if [ -f /tmp/testpilot-backend.json ]; then
            node scripts/publishTestReport.js /tmp/testpilot-backend.json backend-jest
          fi
