name: Publish BITS faculty report documents

on:
  push:
    branches: [main]
    paths:
      - 'docs/faculty-submission/*.md'
      - 'scripts/build_faculty_documents.py'
      - '.github/workflows/publish-faculty-documents.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faculty-document-build
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document render dependencies
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0 reportlab==4.4.4
      - name: Rebuild updated Word and PDF documents
        run: python scripts/build_faculty_documents.py
      - name: Verify all four output files are non-empty
        shell: bash
        run: |
          set -euo pipefail
          for name in TestPilot_BITS_Final_Report_Updated_2026-11-02 TestPilot_Independent_Review_and_Experiment_Evidence_Packet; do
            test -s "docs/faculty-submission/${name}.docx"
            test -s "docs/faculty-submission/${name}.pdf"
          done
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from reportlab.pdfbase.pdfdoc import PDFCatalog
          root=Path("docs/faculty-submission")
          for filename in root.glob("*.docx"):
              d=Document(filename)
              assert len(d.paragraphs)>40,filename
              print(filename.name,len(d.paragraphs))
          for filename in root.glob("*.pdf"):
              content=filename.read_bytes()
              assert content.startswith(b"%PDF-") and len(content)>6000,filename
              print(filename.name,len(content))
          PY
      - name: Save generated Word/PDF copies to Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/faculty-submission/*.docx docs/faculty-submission/*.pdf
          if git diff --cached --quiet; then
            echo "No generated report changes"
          else
            git commit -m "docs: publish BITS faculty report Word and PDF renderings [skip ci]"
            git push origin HEAD:main
          fi
      - name: Retain downloadable evidence copies even if Git write is restricted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testpilot-bits-final-evidence-documents
          path: |
            docs/faculty-submission/*.docx
            docs/faculty-submission/*.pdf
          if-no-files-found: warn
          retention-days: 30
